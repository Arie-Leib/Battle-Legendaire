<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Légendaire</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>⚔️ Battle Légendaire ⚔️</h1>

<h2>Ton héros</h2>

<p>❤️ Vie : <span id="health">100</span></p>
<p>⚔️ Attaque : <span id="attack">10</span></p>
<p>🛡️ Défense : <span id="defense">5</span></p>
<p>⭐ Niveau : <span id="level">1</span></p>
<p>🪙 Pièces : <span id="coins">0</span></p>

<hr>

<h2>🐺 Loup</h2>

<p>❤️ Vie : <span id="wolfHealth">50</span></p>
<hr>

<div class="actions">
    <button onclick="attack()">
        ⚔️ Attaquer
    </button>

    <button onclick="potion()">
        🧪 Potion
    </button>

    <button onclick="levelButton()">
        ⬆️ Monter de niveau
    </button>
</div>

<br>

<div class="menu">
    <button onclick="inventory()">
        🎒 Inventaire
    </button>

    <button onclick="shop()">
        🛒 Boutique
    </button>

    <button onclick="back()">
        🏠 Retour au menu
    </button>
</div>

<hr><div class="battle-log">
    <h2>📜 Journal du combat</h2>
    <p id="message">
        Le combat va commencer...
    </p>
</div>

<hr>

<script src="main.js"></script>

</body>
</html>
