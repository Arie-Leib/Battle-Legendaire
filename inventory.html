<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Légendaire - Inventaire</title>
    <link rel="stylesheet" href="game.css">
</head>

<body>

    <h1>🎒 Inventaire</h1>

    <div class="card">
        <h2>🗡️ Armes</h2>
        <p>⚔️ Épée en bois</p>
        <p>⚔️ Épée en fer</p>
        <p>⚔️ Épée légendaire</p>
    </div>

    <div class="card">
        <h2>🛡️ Armures</h2>
        <p>🟢 Armure en cuir</p>
        <p>🔵 Armure en fer</p>
        <p>🟣 Armure en diamant</p>
    </div>

    <div class="card">
        <h2>🧪 Objets</h2>
        <p>❤️ Potion de soin</p>
        <p>💎 Cristal magique</p>
        <p>⭐ Clé légendaire</p>
    </div>

    <div class="card">
        <h2>💰 Richesses</h2>
        <p>Pièces : <span id="coins">0</span></p>
        <p>Niveau : <span id="level">1</span></p>
    </div>

    <button onclick="window.location.href='home.html'">
        ⬅ Retour au menu
    </button>

    <script src="main.js"></script>

</body>

</html>
