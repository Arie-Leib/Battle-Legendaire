<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Légendaire - Armes</title>
    <link rel="stylesheet" href="game.css">
</head>

<body>

    <h1>⚔️ Armes</h1>

    <p>Choisis ton arme pour vaincre les ennemis !</p>

    <div class="card">
        <h2>🪵 Épée en bois</h2>
        <p>Attaque : +5</p>
        <button>Équiper</button>
    </div>

    <div class="card">
        <h2>⛓️ Épée en fer</h2>
        <p>Attaque : +12</p>
        <button>Équiper</button>
    </div>

    <div class="card">
        <h2>💎 Épée en diamant</h2>
        <p>Attaque : +25</p>
        <button>Équiper</button>
    </div>

    <div class="card">
        <h2>🔥 Épée de feu</h2>
        <p>Attaque : +35</p>
        <button>Équiper</button>
    </div>

    <div class="card">
        <h2>❄️ Épée de glace</h2>
        <p>Attaque : +40</p>
        <button>Équiper</button>
    </div>

    <div class="card">
        <h2>🌟 Épée légendaire</h2>
        <p>Attaque : +60</p>
        <button>Équiper</button>
    </div>

    <div class="card">
        <h2>👑 Arme suprême</h2>
        <p>Attaque : +100</p>
        <button>Équiper</button>
    </div>

    <button onclick="window.location.href='home.html'">
        ⬅ Retour au menu
    </button>

    <script src="main.js"></script>

</body>

</html>
